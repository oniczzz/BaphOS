# BaphOS: терминал kitty (Mod+T). Пиксельный шрифт CozetteVector (векторная Cozette, MIT —
# fonts/ в репозитории), палитра BaphOS, алый курсор со шлейфом, сигил в углу окна.

# ── шрифт ──
font_family      CozetteVector
bold_font        CozetteVectorBold
italic_font      CozetteVector
bold_italic_font CozetteVectorBold
# 13 px — родной размер Cozette (9.75 pt при 96 dpi): пиксели не размываются
font_size 9.75
disable_ligatures always

# ── курсор: алый блок, без мигания, со шлейфом при прыжках ──
cursor #ff1a1a
cursor_text_color #000000
cursor_shape block
cursor_blink_interval 0
# интеграция с fish без смены формы курсора — он всегда алый блок
shell_integration no-cursor
cursor_trail 4
cursor_trail_decay 0.08 0.25
cursor_trail_start_threshold 3

# ── окно ──
window_padding_width 8
placement_strategy top-left
remember_window_size no
initial_window_width 100c
initial_window_height 30c
confirm_os_window_close 0
# без своего заголовка: окно очерчено алой рамкой niri
hide_window_decorations yes
background_opacity 1.0
window_border_width 2px
draw_minimal_borders yes
active_border_color #ff1a1a
inactive_border_color #3a0000
bell_border_color #ff5040

# сигил в правом нижнем углу, в родном размере (без масштабирования — пиксельно)
window_logo_path sigil.png
window_logo_position bottom-right
window_logo_alpha 0.22
window_logo_scale 0

# ── звонок: тёмно-красная вспышка вместо звука ──
enable_audio_bell no
visual_bell_duration 0.15
visual_bell_color #6b0000

# ── вкладки снизу, разделитель † ──
tab_bar_edge bottom
tab_bar_style separator
tab_separator " † "
tab_title_template " {index}:{title} "
tab_bar_margin_height 4 0
tab_bar_background #000000
active_tab_foreground #000000
active_tab_background #ff1a1a
active_tab_font_style bold
inactive_tab_foreground #787070
inactive_tab_background #0a0a0a
inactive_tab_font_style normal

# ── ссылки ──
url_color #ff1a1a
url_style straight

# ── прокрутка ──
scrollback_lines 5000
scrollback_indicator_opacity 0.6

# ── цвета BaphOS (как в foot): красный = алый, остальное приглушено, чтобы ls/git читались ──
foreground #d8d8d8
background #000000
selection_foreground #000000
selection_background #ff1a1a
mark1_foreground #000000
mark1_background #ff1a1a

color0  #161212
color8  #3a3434
color1  #ff1a1a
color9  #ff5040
color2  #7c8a54
color10 #9aab6c
color3  #b8955a
color11 #d8b878
color4  #5a5a82
color12 #7a7aa8
color5  #8b1a3a
color13 #b02a52
color6  #6e8c8c
color14 #8fb0b0
color7  #a8a0a0
color15 #d8d8d8

# ── клавиши (поверх стандартных) ──
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t     new_tab_with_cwd

<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- BaphOS: CozetteVector — векторная копия пиксельного Cozette.
     1) В метаданных он не помечен моноширинным — kitty его не видел: ставим spacing=mono.
     2) Со сглаживанием пиксельные буквы выходят тонкими и размытыми: рисуем его БЕЗ сглаживания
        и с полной привязкой к сетке — тогда он чёткий, как растровый Cozette. -->
<fontconfig>
  <match target="scan">
    <test name="family" compare="contains"><string>CozetteVector</string></test>
    <edit name="spacing" mode="assign"><int>100</int></edit>
  </match>
  <match target="font">
    <test name="family" compare="contains"><string>CozetteVector</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit>
  </match>
</fontconfig>

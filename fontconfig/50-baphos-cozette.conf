<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- BaphOS: CozetteVector моноширинный, но в метаданных это не отмечено — kitty его не видел.
     Помечаем при сканировании spacing=mono (100). -->
<fontconfig>
  <match target="scan">
    <test name="family" compare="contains"><string>CozetteVector</string></test>
    <edit name="spacing" mode="assign"><int>100</int></edit>
  </match>
</fontconfig>

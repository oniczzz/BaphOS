<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- BaphOS: Monocraft — пиксельный шрифт всего райса. Рисуем его без сглаживания и с полной
     привязкой к сетке: пиксели остаются квадратными и чёткими в kitty, GTK и Qt. -->
<fontconfig>
  <match target="font">
    <test name="family" compare="contains"><string>Monocraft</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>

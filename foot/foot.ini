# BaphOS: терминал foot. Пиксельный шрифт Cozette (растровый: только pixelsize=13 чёткий).
# Цвета: фон чёрный, текст кость, акцент алый; остальные цвета приглушены, чтобы ls/git читались.

[main]
font=Cozette:pixelsize=13
font-bold=Cozette:pixelsize=13
dpi-aware=no
pad=8x6
term=xterm-256color
initial-window-size-chars=100x30

[cursor]
style=block
blink=no

[csd]
size=22
font=Cozette:pixelsize=13
color=ff000000
border-width=2
border-color=ff6b0000
button-width=24
button-color=ffff1a1a
button-minimize-color=ff000000
button-maximize-color=ff000000
button-close-color=ff3a0000

[mouse]
hide-when-typing=yes

[scrollback]
lines=5000

[colors-dark]
alpha=1.0
background=000000
foreground=d8d8d8
selection-foreground=000000
selection-background=ff1a1a
urls=ff1a1a
jump-labels=000000 ff1a1a
scrollback-indicator=000000 6b0000
cursor=000000 ff1a1a

# 0 чёрный, 1 красный, 2 зелёный, 3 жёлтый, 4 синий, 5 пурпурный, 6 бирюзовый, 7 белый
regular0=161212
regular1=ff1a1a
regular2=7c8a54
regular3=b8955a
regular4=5a5a82
regular5=8b1a3a
regular6=6e8c8c
regular7=a8a0a0

bright0=3a3434
bright1=ff5040
bright2=9aab6c
bright3=d8b878
bright4=7a7aa8
bright5=b02a52
bright6=8fb0b0
bright7=d8d8d8

dim0=0a0a0a
dim1=a00000
